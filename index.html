<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Panel financiero personal offline para controlar ingresos de trabajo fijo y reparto, gastos, deudas, ahorro, gasolina y kilometraje.">
  <meta name="color-scheme" content="light">
  <title>La app del HecAgus</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="pwa-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="index">
  <header class="header dashboard-header">
    <div class="dashboard-brand">
      <div class="dashboard-brand-icon" aria-hidden="true">▥</div>
      <div>
        <h1>La app del HecAgus</h1>
        <small>Resumen financiero</small>
      </div>
    </div>
  </header>

  <main class="container dashboard-container">
    <section class="card text-center dashboard-income-hero" aria-labelledby="repartoHoyTitle">
      <div id="repartoHoyTitle" class="dashboard-eyebrow">Reparto de hoy</div>
      <p id="resGananciaBruta" class="dashboard-income-value" aria-live="polite">$0.00</p>
      <small>Ingresos brutos generados hoy</small>
    </section>

    <div id="resumenHumanoContainer" class="dashboard-summary" aria-live="polite"></div>

    <section class="card dashboard-today-card" aria-labelledby="metricasRepartoTitle">
      <div id="metricasRepartoTitle" class="dashboard-section-title"><span aria-hidden="true">🛵</span> Reparto hoy</div>
      <ul class="dashboard-today-metrics">
        <li><span>Turnos</span><strong id="uiTurnosHoy">—</strong></li>
        <li><span>Horas</span><strong id="uiHorasHoy">—</strong></li>
        <li><span>Por hora</span><strong id="uiIngresoHoraHoy">—</strong></li>
      </ul>
    </section>

    <section class="card hidden"><div id="uiCompromisos"></div></section>
  </main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <a href="index.html" class="nav-link active" aria-current="page"><span aria-hidden="true">▥</span>Panel</a>
    <a href="wallet.html" class="nav-link"><span aria-hidden="true">◉</span>Wallet</a>
    <a href="admin.html" class="nav-link"><span aria-hidden="true">⚙</span>Admin</a>
    <a href="stats.html" class="nav-link"><span aria-hidden="true">⌁</span>Stats</a>
    <a href="historial.html" class="nav-link"><span aria-hidden="true">≡</span>Historial</a>
  </nav>

  <script type="module" src="./js/05_init.js"></script>
</body>
</html>
