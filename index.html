<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Panel financiero híbrido para trabajo principal Jaimau/Ingenico y turnos secundarios de Uber Eats.">
  <meta name="color-scheme" content="light">
  <title>La app del HecAgus</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="pwa-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="index">
  <header class="header dashboard-header">
    <div class="dashboard-brand">
      <div class="dashboard-brand-icon" aria-hidden="true">▥</div>
      <div>
        <h1>La app del HecAgus</h1>
        <small>Trabajo + finanzas</small>
      </div>
    </div>
  </header>

  <main class="container dashboard-container">
    <section class="card text-center dashboard-income-hero" aria-labelledby="mainWorkEyebrow">
      <div id="mainWorkEyebrow" class="dashboard-eyebrow">JAIMAU · QUINCENA ACTUAL</div>
      <p id="mainWorkValue" class="dashboard-income-value" aria-live="polite">Sin jornadas</p>
      <small id="mainWorkSub">0 h · 0 km · Pago pendiente</small>
    </section>

    <div id="resumenHumanoContainer" class="dashboard-summary" aria-live="polite"></div>

    <section class="card dashboard-today-card" aria-labelledby="actividadHoyTitle">
      <div id="actividadHoyTitle" class="dashboard-section-title"><span aria-hidden="true">🗓️</span> Actividad de hoy</div>
      <ul class="dashboard-today-metrics">
        <li><span>💼 Jaimau</span><strong id="uiJaimauHoy">—</strong></li>
        <li><span>🛵 Uber</span><strong id="uiUberHoy">—</strong></li>
        <li><span>Turnos</span><strong id="uiTurnosHoy">0</strong></li>
      </ul>
    </section>

    <section class="card hidden"><div id="uiCompromisos"></div></section>
  </main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <a href="index.html" class="nav-link active" aria-current="page"><span aria-hidden="true">▥</span>Panel</a>
    <a href="wallet.html" class="nav-link"><span aria-hidden="true">◉</span>Wallet</a>
    <a href="admin.html" class="nav-link"><span aria-hidden="true">⚙</span>Admin</a>
    <a href="stats.html" class="nav-link"><span aria-hidden="true">⌁</span>Stats</a>
    <a href="historial.html" class="nav-link"><span aria-hidden="true">≡</span>Historial</a>
  </nav>

  <script type="module" src="./js/05_init.js"></script>
</body>
</html>
