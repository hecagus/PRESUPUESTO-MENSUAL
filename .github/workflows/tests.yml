name: Tests

on:
  push:
    branches: [main, 'v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test financial engine
        run: npm test
      - name: Verify financial calendar in Mexico
        run: npm test
        env:
          TZ: America/Mexico_City
      - name: Verify Firestore isolation
        run: npm run test:rules
