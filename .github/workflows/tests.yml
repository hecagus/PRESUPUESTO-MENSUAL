name: Tests

on:
  push:
    branches: [main, 'v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test financial engine
        run: npm test
