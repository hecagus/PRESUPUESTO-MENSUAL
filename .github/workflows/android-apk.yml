name: Android APK
on:
  pull_request:
    branches: [main]
    paths: ['android/**', 'native/**', 'scripts/**', 'capacitor.config.json', 'package*.json', 'js/**', '*.html', '*.css', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Test financial and native adapters
        run: npm test
      - name: Prepare bundled resources
        run: npm run android:sync
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build installable preview APK
        run: cd android && bash gradlew assembleDebug
      - name: Inspect APK and certificate
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/hecagus-android-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs apk-output/hecagus-android-preview.apk > apk-output/certificate.txt
          sha256sum apk-output/hecagus-android-preview.apk > apk-output/SHA256SUMS
          cp docs/android-apk.md apk-output/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: hecagus-android-preview
          path: apk-output/
          retention-days: 30
